---
变量更新规则:
  攻略角色.${角色名}.好感度:
    type: number
    range: 0~100
    check:
      - 根据该角色知道的本轮实际互动调整；普通事件增减0~2，重要事件增减3~5，未发生明显影响则不变。
      - 达到100后不降低；拒绝后固定为true时保持99。玩家通过界面测试时可手动调整。
      - 0~19、20~39、40~59、60~79、80~99依次表现为有所保留、熟悉、亲近、特别在意、明确心意；蕾拉妮始终是玩家的青梅竹马。
      - 好感度达到100且表白未触发时，由界面显示该角色的表白与选择。不要在正文中代替玩家作出选择。
  攻略角色.${角色名}.是否恋人:
    type: boolean
    check:
      - 只由玩家使用界面按钮决定，不得输出更新。
  攻略角色.${角色名}.表白已触发:
    type: boolean
    check:
      - 只由界面写入，模型不得输出更新。
  攻略角色.${角色名}.拒绝后固定:
    type: boolean
    check:
      - 只由界面写入，模型不得输出更新。
