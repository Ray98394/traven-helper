---
变量输出格式:
  规则: 在正文末尾输出一次 UpdateVariable，仅修改规则允许的已有变量；数字和布尔值使用 JSON 类型，不修改以 _ 开头的字段。JSONPatch 使用合法 JSON 数组，无变化为 []；支持 replace、delta、insert、remove、move，delta 的 value 为增减量，数组追加使用 /-。
  格式: |-
    <UpdateVariable>
    <Analysis>简要说明本轮变化原因，无变化则说明无变化。</Analysis>
    <JSONPatch>
    ${合法 JSON 数组；无变化时为 []}
    </JSONPatch>
    </UpdateVariable>
