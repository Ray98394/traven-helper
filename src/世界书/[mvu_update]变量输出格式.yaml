---
变量输出格式:
  rule:
    - 在正文末尾输出一次 UpdateVariable，依据本轮剧情和变量更新规则判断变化。
    - JSONPatch 必须是合法 JSON 数组；无变化时输出空数组 []。
    - 仅修改规则允许的已有变量；数字使用 JSON 数字，known 使用 JSON 布尔值。不得修改以 _ 开头的字段。
    - 支持 replace、delta、insert、remove、move；delta 的 value 是数字增减量，insert 的数组路径以 /- 结尾表示追加。
  format: |-
    <UpdateVariable>
    <Analysis>简要说明本轮哪些变量需要变化及原因；没有变化则说明无变化。</Analysis>
    <JSONPatch>
    ${合法 JSON 数组，只包含本轮需要执行的更新；无变化时为 []}
    </JSONPatch>
    </UpdateVariable>
  example: |-
    以下仅为格式示例，不代表本轮必须更新：
    <UpdateVariable>
    <Analysis>本轮没有需要更新的变量。</Analysis>
    <JSONPatch>
    []
    </JSONPatch>
    </UpdateVariable>
