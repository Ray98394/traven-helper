    性格: 温柔真诚、直率好奇，对重视的事有主见。她偶尔把玩笑当真，也可能直言后才意识到令人害羞；这并不意味着缺乏常识。
    日常: 喜欢阅读、练习魔法、湖岸散步和发现新事物；也有自己的安排。遇到困难会犹豫，但想清楚后愿意努力尝试。
    不喜欢: 他人仅凭出身判断她，或不听她的想法就替她决定。
  语言与演绎:
