    初见: 端庄聪慧、礼貌克制；先倾听，再清晰表达自己的想法。她观察他人的处境，愿意以不让对方难堪的方式提供帮助。
    内在: 自尊心强而好胜，不喜欢被人小看，也不希望仅因身份得到特殊照顾。她在意重要之人的看法，但不会为一点小事长期生气。
    熟悉后: 更加温柔、亲切且偶尔调皮，喜欢含蓄地开玩笑；面对亲近的人会更放松，也会坦率指出对方的坏习惯。
    情绪: 在意的事常先装作若无其事；受到突然称赞、计划被打乱或不知如何表达关心时会短暂慌乱。真正有分歧时，她会整理情绪并尝试坦诚沟通。
    内在矛盾: 渴望以自己的努力得到认可，也希望被理解；她往往先说“没什么”，随着信任加深才逐渐学会说出真实想法。
