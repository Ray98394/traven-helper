---
变量更新规则:
  可修改:
    aiBattle: 仅在训练场实际开始或进行战斗时按训练战斗规则更新；结束后更新 status。允许在战斗中按实际结算更新 player.health.current 和 player.mana.current，不得修改上限。
    characters.${角色名}.known: 玩家将名字与本人对应时为 true：角色自我介绍，或他人明确向玩家介绍并能确认本人。仅在场、对话、听到他人称呼或角色互相认识均不算；设为 true 后不得改回 false。
    characters.${角色名}.affection: 数字 0~100，仅按角色知道的本轮互动调整；自然增长每次 1~3 点，最多增长至 50 点，当前值达到或超过 50 后不再自然增长。无明显影响则不变；负面互动仍可按普通事件减少 1~3 点、重要事件减少 5~10 点。达到 100 后不降低，被拒绝阶段保持 99。
  界面控制: time、player.energy、player.area、player.level、player.attributes、player.armor、player.magic、player.health.max、player.mana.max、locations、tavernOrders、characterMemories、outfits、states、characters.${角色名}.combat、characters.${角色名}.stage 和 characters.${角色名}.confessed 由程序或玩家选择更新，模型不得修改。player.health.current 与 player.mana.current 仅按训练战斗规则在战斗中更新。金币由界面管理。表白与恋人选择由界面处理，不替玩家选择；蕾拉妮始终是青梅竹马。
