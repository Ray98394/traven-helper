---
变量更新规则:
  游戏时间:
    check:
      - 年月日与天数由界面在玩家休息时统一更新，模型不得修改。
  玩家.行动点:
    check:
      - 由界面移动和每日刷新管理，模型不得修改。
  玩家.具体地点:
    check:
      - 由界面移动和每日刷新管理，模型不得修改。
  攻略角色.${角色名}.具体地点:
    check:
      - 每日位置由程序根据角色日程刷新，模型不得修改。
  攻略角色.${角色名}.是否认识:
    type: boolean
    check:
      - 表示玩家是否已将角色的名字与本人对应起来；角色之间互相认识不代表玩家认识该角色。
      - 未认识的角色与玩家对话或出现并不自动认识；角色自我介绍，或他人明确向玩家介绍该角色并能确认本人时，更新为true。
      - 他人在谈话中提起姓名、角色在场但没有向玩家说明身份，不自动更新；设为true后不得改回false。
      - 其他角色可以正常提及未认识角色的名字，正文与旁白不需要隐藏这些名字。
  攻略角色.${角色名}.好感度:
    type: number
    range: 0~100
    check:
      - 根据该角色知道的本轮实际互动调整；普通事件增减1~3，重要事件增减5~10，未发生明显影响则不变。
      - 达到100后不降低；拒绝后固定为true时保持99。玩家通过界面测试时可手动调整。
      - 未认识时为陌生阶段；认识后0~19、20~39、40~59、60~79、80~99依次表现为有所保留、熟悉、亲近、特别在意、明确心意；蕾拉妮始终是玩家的青梅竹马。
      - 好感度达到100且表白未触发时，由界面显示该角色的表白与选择。不要在正文中代替玩家作出选择。
  攻略角色.${角色名}.好感度阶段:
    type: string
    check:
      - 由程序根据是否认识和好感度自动计算，模型不得修改此变量。
  攻略角色.${角色名}.是否恋人:
    type: boolean
    check:
      - 只由玩家使用界面按钮决定，不得输出更新。
  攻略角色.${角色名}.表白已触发:
    type: boolean
    check:
      - 只由界面写入，模型不得输出更新。
  攻略角色.${角色名}.拒绝后固定:
    type: boolean
    check:
      - 只由界面写入，模型不得输出更新。
