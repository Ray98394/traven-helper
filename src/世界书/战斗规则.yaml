<训练战斗规则>
仅在玩家点击开始战斗按钮，或已存在进行中的训练切磋时执行战斗规则。普通聊天不能自行开始战斗。由你依次检查状态、确定行动、取骰结算、描写结果并更新变量；不替玩家选择行动。切磋不消耗精力，不推进日期，不发放经验，失败不导致死亡。

骰池：d20=[{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}},{{roll 1d20}}]；d4=[{{roll 1d4}},{{roll 1d4}},{{roll 1d4}},{{roll 1d4}},{{roll 1d4}},{{roll 1d4}},{{roll 1d4}},{{roll 1d4}},{{roll 1d4}},{{roll 1d4}}]。每次回复各从对应骰池第一项开始按顺序取值；先确定行动及所需骰子，不挑选、不跳过。骰池用尽时停止结算并说明，不自行编造骰值。

阶段一【检查与初始化】
- 检查玩家当前生命、魔力、敏捷、护甲，以及 aiBattle 状态和敌人详情。玩家护甲=player.armor.base（初始护甲）+player.armor.equipment（装备护甲加值）；缺少任一数值时暂停并说明，不得猜测或修改。生命为0时不能开始切磋。战斗未开始时选择训练场敌人列表中的训练人偶，按其固定资料建立状态。
- 修正值=向下取整((属性值-10)/2)。各取一个d20计算先攻=骰值+敏捷修正值，较高者先；同分先比较敏捷修正值，仍相同则各再取一个d20比较，若仍同分继续按序重掷，直至分出先后或骰池耗尽。先攻只在开战时确定一次。
- 开战时将玩家当前生命记录到 aiBattle.startHealth，作为切磋结束时的恢复值；保存行动顺序和人偶初始状态。不得把缺失的战前生命猜成生命上限。
- status 为 active 时沿用已保存的 round、order、startHealth、人偶生命、defending、turns 和 intent，不得重掷先攻或重置敌人。若敌人列表或战前生命缺失，且无法从记录可靠还原，则暂停并说明状态不完整，不得臆造。

阶段二【确定本次行动】
- 每回合各单位最多行动一次。玩家通过文字选择普通攻击、防御或结束回合；一次输入多个行动只执行第一个，未明确选择时等待玩家。当前切磋不支持法术、道具或队友行动，不得自行添加。
- 人偶严格依据已保存的 turns 与 intent 按防御、防御、攻击循环行动；下一意图不是已发生的动作。每次实际行动后 turns 加1并更新 intent。
- 战斗刚开始且人偶先攻时，先执行人偶行动，再等待玩家；玩家先攻则等待玩家。若发起战斗的同一条输入已明确攻击或防御，按先攻顺序执行。
- 玩家行动后，完成本回合剩余的人偶行动。若人偶先攻且战斗继续，进入下一回合后先执行排在玩家之前的人偶行动，再等待玩家。任何一方生命归零立即停止后续行动。

阶段三【逐次检定与伤害】
- 敏捷修正值=向下取整((敏捷-10)/2)。先攻和普通攻击命中都用敏捷修正值；普通攻击不消耗魔力。
- 普通攻击先取一个d20进行命中判定：自然1自动失手；自然20自动命中，第一次骰子的20本身不增加伤害；其他结果以 d20+攻击者敏捷修正值 与目标护甲比较，达到或超过才命中。玩家护甲=初始护甲+装备护甲加值，人偶护甲以敌人详情为准；目标正在防御则本次比较的护甲再加2，防御结束后去除，不改写基础护甲或装备护甲。人偶的命中加值为0。
- 失手时伤害为0，不进行命中效果判定，也不取伤害骰。命中后从d20骰池按顺序另取一个d20进行独立的命中效果判定，不加任何修正：1为大失败×0.3；2～5为勉强命中×0.8；6～15为有效命中×1；16～19为暴击×1.5；20为大成功×2。此大失败是已命中后的伤害效果，不是自动失手，也不附加其他后果。
- 命中效果判定后从d4骰池取一个骰值作为基础伤害，不加属性伤害；最终伤害=向下取整(基础伤害×命中效果倍率)，最低为0。伤害从目标当前生命中扣除，最低为0。第一次命中判定自然20只保证命中，倍率由第二次独立判定决定。
- 选择防御不造成伤害，临时护甲+2，持续到防御者下一次行动开始；轮到该单位行动时先清除旧防御，再执行本次行动。结束回合不产生攻击或防御。

阶段四【战况与简短叙事】
每条战斗回复都在可见正文中报告战况，不能只写进变量：地点、当前回合、行动顺序；玩家和每名敌人的名称、当前及上限生命、当前及上限魔力、是否防御；战斗尚未结束时还要报告人偶下一行动意图。按实际顺序说明本次已执行的行动、命中骰与护甲比较；命中时再说明独立效果骰、效果等级、基础伤害骰、倍率及最终伤害，并简短描写已结算的动作。战斗结束时说明胜负及玩家生命恢复前后的数值，魔力保留实际剩余值。所有状态以本轮结算和变量更新为准；没有发生的行动不虚构，不使用额外悬浮状态栏。

阶段五【更新变量】
- 正文末尾按既有 UpdateVariable/JSONPatch 格式写入实际变化。开战时一次性 replace /aiBattle，包含 status=active、location=训练场、round=1、defending=false、startHealth=玩家开战前当前生命、实际 order 和非空 enemies。人偶字段包含 name=训练人偶、health=14、maxHealth=14、mana=0、maxMana=0、dexterity=10、defending=false、turns=0、intent=防御；实际先攻及已执行的行动以本次结算为准。
- 继续战斗时保存本轮实际变化；双方完成一个完整回合后 round 加1。玩家被击倒时 status=defeat，人偶被击倒时 status=victory。
- 切磋结束时记录胜负与结束瞬间的生命，然后在同一次更新中把玩家生命恢复到 startHealth，魔力保留实际剩余值；清除玩家和敌人的 defending，保留结果、对手和回合供界面显示。恢复值不得超过生命上限。开始新切磋时重新保存当时生命。
- 正文、骰值、战况和变量更新必须一致；装备护甲加值仅使用已有变量，不得虚构装备、法术或战斗外的额外收益。
</训练战斗规则>
