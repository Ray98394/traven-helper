const stat = getvar('stat_data', { defaults: {} });
const rawLocation = stat?.player?.area?.place;
const location = Array.isArray(rawLocation) ? rawLocation[0] : rawLocation;
const scenes = {
  '弗尔根斯学院': '灰白色石墙与高塔构成的学院建筑，设有教室和研究空间，供学员学习辉石魔法。',
