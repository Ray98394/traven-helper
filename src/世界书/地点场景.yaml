  '兰斯特学院': '坐落在建筑群西侧的古老学院，由高耸石质建筑和相连走廊组成，供学员上课与研究。',
  '雷格努姆学院': '深蓝与银白装饰点缀的庄严建筑，设有教室和礼仪空间，是雷格努姆学院的教学场所。',
  '训练场': '位于学院建筑之间的露天场地，铺有平整石板，供学员进行日常练习和切磋。',
  '图书馆': '带有高窗的宽敞石质建筑，内部排列着书架与阅览桌，供学员阅读和查找资料。',
  '湖岸边': '靠近学院的自然湖岸，沿水边有可通行的小路，适合散步、观景与停留。',
  '魔法师协会': '带有圆形屋顶和醒目标志的公共建筑，供魔法师交流、登记事务和接受委托。',
  '猎人小屋': '森林边的简朴木屋，旁边有储物棚，供猎人存放用品和在进山前歇脚。',
  '码头': '湖岸边建有木质栈桥、停船位和仓储建筑，用于船只停靠及货物装卸。',
  '玩家的家': '位于居民区的普通住宅，设有卧室和日常起居空间，是玩家休息的地方。',
  '月神广场': '铺设石砖的开放广场，周边连接城镇街道与商铺，供居民会面、休息和举办活动。',
  '市政厅': '城镇中醒目的石质公共建筑，内设办事大厅，用于处理居民事务和发布公告。',
  '学校正门': '由石柱、大门和两侧值守空间组成的入口，供学员、教职人员及访客出入学校。',
  '湖心岛': '湖中的小岛，岸边有可供停船的空地；岛上建筑与具体用途尚未确定。',
  '南方村庄': '山脚附近的小聚落，几间石木住宅分布在田地旁，居民以耕种和日常劳作为主；正式村名待定。',
  '岔路驿站': '靠近道路交汇处的木石建筑，设有休息空间和停放车辆的位置，供旅人歇脚。',
  '暮林村': '湖泊东南侧的小村庄，住宅沿道路与田地分布，是附近居民生活和耕作的地方。',
  '湖岸村': '湖岸道路旁由几间住宅组成的小聚落，居民沿岸往返学院及附近地区。',
  '澄湾村': '东北湖湾附近的村庄，房屋面向湖面，村民通过道路与周边地区往来。',
  '兔兔酒馆': '挂有兔子招牌的两层建筑，木门为暖色；一楼供客人用餐喝酒，楼上为旅人提供住宿。酒馆里的兔女郎按店内安排陪客人聊天、倾听或参与桌边小游戏；日常送餐、清洁、收拾桌面等杂务由其他店员负责。兔女郎平时不负责门口迎客。',
  '铁匠铺': '临街的石木工坊，外侧设有炉火与工作台，负责打造和修理金属制品。',
