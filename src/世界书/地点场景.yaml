};
const sceneKey = location === '{{user}}的家' ? '玩家的家' : location;
const description = typeof sceneKey === 'string' && Object.hasOwn(scenes, sceneKey) ? scenes[sceneKey] : undefined;
_%>
<%_ if (description) { _%>
<当前地点场景>
<%- JSON.stringify({ 地点: sceneKey, 建筑与功能: description }) %>
根据地点描述自然描写场景，人物在场情况以当前地点与角色变量为准；不要把未确定的细节当作已知事实，也不要代替玩家行动。
</当前地点场景>
<%_ } _%>
<%_ } _%>
